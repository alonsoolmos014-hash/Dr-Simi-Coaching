<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr Simi Coaching</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1826;--panel:#14243a;--line:#26395a;--tx:#e8e4d8;--mut:#8fa0b8;--ac:#ff4655;--gd:#e0b84c;--ok:#4cc9a0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef0f4;--panel:#fff;--line:#cdd5e2;--tx:#14243a;--mut:#5c6b82;--ac:#d92b3c;--gd:#9a7410;--ok:#127a5b}}
:root[data-theme="light"]{--bg:#eef0f4;--panel:#fff;--line:#cdd5e2;--tx:#14243a;--mut:#5c6b82;--ac:#d92b3c;--gd:#9a7410;--ok:#127a5b}
:root[data-theme="dark"]{--bg:#0d1826;--panel:#14243a;--line:#26395a;--tx:#e8e4d8;--mut:#8fa0b8;--ac:#ff4655;--gd:#e0b84c;--ok:#4cc9a0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;margin:0;letter-spacing:.01em}
header{padding:28px 20px 8px;max-width:1040px;margin:auto}
h1{font-size:clamp(40px,8vw,72px);line-height:.95;font-weight:700}
h1 span{color:var(--ac)}
.sub{color:var(--mut);margin:8px 0 0;max-width:60ch}
nav{display:flex;gap:4px;max-width:1040px;margin:18px auto 0;padding:0 20px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;color:var(--mut);font:600 20px 'Barlow Condensed',sans-serif;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:var(--tx);border-color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
main{max-width:1040px;margin:auto;padding:22px 20px 60px}
section[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.pl{border-top:4px solid var(--c)}
.av{width:56px;height:56px;border-radius:50%;background:var(--c);color:#0d1826;display:grid;place-items:center;font:700 24px 'Barlow Condensed',sans-serif;margin-bottom:10px}
.pl h3{font-size:24px}.pl small{color:var(--mut);display:block}
.tag{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:0 7px;margin:6px 4px 0 0;font-size:13px;color:var(--mut)}
.row{display:flex;gap:18px;flex-wrap:wrap}
.row>*{flex:1 1 300px}
.stat{font:700 44px/1 'Barlow Condensed',sans-serif}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.lo{background:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500}
.w{color:var(--ok);font-weight:500}.l{color:var(--ac);font-weight:500}
.scroll{overflow-x:auto}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
label{font-size:13px;color:var(--mut);display:grid;gap:3px}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:8px;font:inherit;width:100%}
.btn{background:var(--ac);color:#fff;border:0;border-radius:4px;padding:9px 16px;font:600 18px 'Barlow Condensed',sans-serif;cursor:pointer}
.btn.alt{background:none;border:1px solid var(--line);color:var(--tx)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tools button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;font:inherit}
.tools button[aria-pressed=true]{border-color:var(--gd);color:var(--gd)}
canvas{width:100%;max-width:760px;aspect-ratio:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;touch-action:none;display:block;cursor:crosshair}
.goal{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.goal input{width:auto;margin-top:5px}
.done span{text-decoration:line-through;color:var(--mut)}
h2{font-size:32px;margin-bottom:12px}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .5s}}
.chipb{background:var(--bg);color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:4px 10px;margin:2px 4px 2px 0;cursor:pointer;font:inherit;font-size:14px}
.chipb[aria-pressed=true]{border-color:var(--gd);color:var(--gd)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:560px}
.dh{color:var(--mut);font-size:13px;text-align:center}
.day{min-height:78px;text-align:left;vertical-align:top;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px;color:var(--tx);cursor:pointer;font:inherit;font-size:13px;overflow:hidden}
.chip{display:block;font-size:11px;border-radius:2px;padding:0 4px;margin-top:2px;color:#0d1826;background:var(--c);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
td input{min-width:90px}
#note{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 14px;border-radius:4px;z-index:9}
.ro #fm,.ro #fe,.ro #fp,.ro .goal-add,.ro [data-del],.ro .row form[data-p]{display:none}
.ro textarea,.ro [data-rf]{pointer-events:none}
.ro #fr,.ro [data-rdel]{display:none}
.ro td input{pointer-events:none;border-color:transparent}
.chipb[disabled]{opacity:.45;cursor:not-allowed}
#auth button{padding:5px 12px;font-size:16px}
</style>
</head>
<body>
<header>
<h1>Dr Simi <span>Coaching</span></h1>
<p class="sub">Equipo UAH Valorant: roster, partidas, nómina, calendario y objetivos en un solo lugar. <a href="https://tracker.gg/valorant/premier/teams/35faf7b8-ac21-4e5a-8008-be784929958c" target="_blank" rel="noopener" style="color:var(--gd)">Equipo Premier en tracker.gg</a></p>
<div id="auth" style="margin-top:12px"></div>
</header>
<nav role="tablist" id="tabs"></nav>
<div id="note" role="status" hidden></div>
<main>
<section id="s-panel"></section>
<section id="s-partidas" hidden></section>
<section id="s-rend" hidden></section>
<section id="s-riv" hidden></section>
<section id="s-nomina" hidden></section>
<section id="s-calendario" hidden></section>
<section id="s-objetivos" hidden></section>
</main>
<script>
var $=function(s){return document.querySelector(s)};
var P=[
{n:"Jugador 1",r:"Duelista",a:["Jett","Raze"],c:"#ff4655"},
{n:"Jugador 2",r:"Iniciador",a:["Sova","Fade"],c:"#e0b84c"},
{n:"Jugador 3",r:"Controlador",a:["Omen","Astra"],c:"#4cc9a0"},
{n:"Jugador 4",r:"Centinela",a:["Cypher","Killjoy"],c:"#6fa8ff"},
{n:"Jugador 5",r:"Flex / IGL",a:["Skye","Viper"],c:"#c58bff"}];
var M=[
{d:"2026-10-02",m:"Ascent",v:"Rival A",a:13,b:9,p:2,t:"Scrim"},
{d:"2026-10-04",m:"Haven",v:"Rival B",a:8,b:13,p:1,t:"Scrim"},
{d:"2026-10-06",m:"Ascent",v:"Rival C",a:13,b:11,p:1,t:"Oficial"},
{d:"2026-10-07",m:"Bind",v:"Rival A",a:13,b:5,p:2,t:"Scrim"},
{d:"2026-10-08",m:"Haven",v:"Rival D",a:11,b:13,p:0,t:"Oficial"}];
var G=[
{p:0,t:"Mejorar crosshair placement en rondas de ataque",x:1},
{p:0,t:"Entrar primero solo con utilidad de apoyo",x:0},
{p:1,t:"Reducir dardos desperdiciados en retakes",x:0},
{p:2,t:"Comunicar timings de humo en defensa",x:1},
{p:3,t:"Cambiar posición después de cada kill",x:0},
{p:4,t:"Llamar eco/force antes de la ronda 3",x:0}];
var tabs=[["panel","Panel"],["partidas","Partidas"],["rend","Rendimiento"],["riv","Rivales"],["nomina","Nómina"],["calendario","Calendario"],["objetivos","Objetivos"]];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function show(id){tabs.forEach(function(t){$("#s-"+t[0]).hidden=t[0]!==id});
document.querySelectorAll("#tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.t===id)});
}
$("#tabs").innerHTML=tabs.map(function(t){return '<button role="tab" data-t="'+t[0]+'">'+t[1]+'</button>'}).join("");
$("#tabs").onclick=function(e){if(e.target.dataset.t)show(e.target.dataset.t)};

function stats(){var w=M.filter(function(x){return x.a>x.b}).length;
var pi=M.reduce(function(s,x){return s+x.p},0);
return{n:M.length,w:w,wr:M.length?Math.round(w/M.length*100):0,pw:M.length?Math.round(pi/(M.length*2)*100):0}}
function byMap(){var o={};M.forEach(function(x){o[x.m]=o[x.m]||{n:0,w:0};o[x.m].n++;if(x.a>x.b)o[x.m].w++});return o}

function rPanel(){var s=stats();
$("#s-panel").innerHTML=nextPrem()+'<div class="row" style="margin-bottom:22px"><div class="card"><div class="stat">'+s.wr+'%</div>Winrate ('+s.w+' de '+s.n+' partidas)</div><div class="card"><div class="stat">'+s.pw+'%</div>Pistols ganadas</div><div class="card"><div class="stat">'+G.filter(function(g){return g.x}).length+'/'+G.length+'</div>Objetivos cumplidos</div></div><h2>Roster</h2><div class="grid">'+
P.map(function(p){return '<div class="card pl" style="--c:'+p.c+'"><div class="av">'+esc(p.n.slice(-1))+'</div><h3>'+esc(p.n)+'</h3><small>'+esc(p.r)+'</small><small>'+esc(p.rk)+' · K/D '+p.kd+' · ACS '+p.acs+'</small><small>Win '+(p.wr||'-')+'% · HS '+(p.hs||'-')+'% · Pico '+esc(p.pk||'-')+'</small>'+p.a.map(function(a){return '<span class="tag">'+a+'</span>'}).join("")+'</div>'}).join("")+'</div>'+prem()}

function rPartidas(){var bm=byMap(),fld=function(l,n){return '<label>'+l+'<input name="'+n+'"></label>'};
$("#s-partidas").innerHTML='<h2>Registrar partida</h2><div class="card"><form id="fm"><label>Fecha<input type="date" name="d" required value="'+iso(TD)+'"></label><label>Mapa<select name="m">'+["Ascent","Bind","Haven","Split","Lotus","Sunset","Icebox","Pearl","Abyss"].map(function(m){return '<option>'+m+'</option>'}).join("")+'</select></label><label>Rival<input name="v" required list="rv" placeholder="Nombre"></label><datalist id="rv">'+R.map(function(r){return '<option value="'+esc(r.n)+'">'}).join("")+'</datalist><label>UAH<input type="number" name="a" min="0" max="30" required></label><label>Rival (rondas)<input type="number" name="b" min="0" max="30" required></label><label>Pistols ganadas<select name="p"><option>0</option><option>1</option><option>2</option></select></label><label>Tipo<select name="t"><option value="Oficial">Oficial / torneo</option><option>Scrim</option></select></label>'+fld("Salió bien","w")+fld("Falló","f")+fld("A corregir","c")+'<button class="btn">Guardar partida</button></form></div><div class="row" style="margin-top:22px"><div style="flex:2 1 420px"><h2>Historial</h2><div class="card scroll"><table><tr><th>Fecha</th><th>Mapa</th><th>Rival</th><th>Marcador</th><th>Tipo</th><th>Notas</th></tr>'+
M.map(function(x,i){return[x,i]}).sort(function(a,b){return a[0].d<b[0].d?1:-1}).map(function(z){var x=z[0],i=z[1],w=x.a>x.b,nf=function(l,k){return '<label style="margin-bottom:6px">'+l+'<textarea rows="2" data-mi="'+i+'" data-mf="'+k+'">'+esc(x[k]||"")+'</textarea></label>'};
return '<tr><td>'+esc(x.d)+'</td><td>'+esc(x.m)+'</td><td>'+esc(x.v)+'</td><td class="'+(w?'w':'l')+'">'+x.a+' - '+x.b+'</td><td>'+esc(x.t)+'</td><td><details><summary style="cursor:pointer">Ver'+((x.w||x.f||x.c)?' ●':"")+'</summary><div style="min-width:220px;margin-top:6px">'+nf("Salió bien","w")+nf("Falló","f")+nf("A corregir","c")+'</div></details></td></tr>'}).join("")+'</table></div></div><div><h2>Winrate por mapa</h2><div class="card">'+
(Object.keys(bm).map(function(k){var r=Math.round(bm[k].w/bm[k].n*100);return '<div>'+esc(k)+' · '+r+'% <small style="color:var(--mut)">('+bm[k].w+'/'+bm[k].n+')</small><div class="bar"><i class="'+(r<50?'lo':'')+'" style="width:'+r+'%"></i></div></div>'}).join("")||'Aún no hay partidas registradas.')+'</div></div></div>';
$("#fm").onsubmit=function(e){e.preventDefault();var f=new FormData(e.target);
M.push({d:f.get("d"),m:f.get("m"),v:f.get("v"),a:+f.get("a"),b:+f.get("b"),p:+f.get("p"),t:f.get("t"),w:f.get("w"),f:f.get("f"),c:f.get("c")});save();rPartidas();rPanel();rRend();rRiv()}}
$("#s-partidas").onchange=function(e){var t=e.target;if(t.dataset.mf){M[+t.dataset.mi][t.dataset.mf]=t.value;save()}};

function rObj(){
$("#s-objetivos").innerHTML='<h2>Objetivos por jugador</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">'+P.map(function(p,i){var gs=G.map(function(g,j){return[g,j]}).filter(function(z){return z[0].p===i});var d=gs.filter(function(z){return z[0].x}).length;var pc=gs.length?Math.round(d/gs.length*100):0;
return '<div class="card pl" style="--c:'+p.c+'"><h3>'+esc(p.n)+' <small style="display:inline">'+esc(p.r)+'</small></h3><div class="bar"><i style="width:'+pc+'%"></i></div>'+
gs.map(function(z){return '<label class="goal '+(z[0].x?'done':'')+'" style="color:var(--tx);font-size:15px"><input type="checkbox" data-j="'+z[1]+'" '+(z[0].x?'checked':'')+'><span>'+esc(z[0].t)+'</span></label>'}).join("")+
'<form class="goal-add" data-p="'+i+'" style="display:flex;gap:6px;margin-top:8px"><input placeholder="Nuevo objetivo" required aria-label="Nuevo objetivo para '+esc(p.n)+'"><button class="btn alt">Añadir</button></form></div>'}).join("")+'</div>';}
$("#s-objetivos").onchange=function(e){if(e.target.dataset.j){G[e.target.dataset.j].x=e.target.checked?1:0;save();rObj();rPanel()}};
$("#s-objetivos").onsubmit=function(e){e.preventDefault();var v=e.target.querySelector("input").value.trim();if(v){G.push({p:+e.target.dataset.p,t:v,x:0});save();rObj();rPanel()}};

var E=[{id:1,d:"2026-10-13",h:"20:00",t:"Entrenamiento",n:"Defaults y retakes"},{id:2,d:"2026-10-15",h:"20:00",t:"Scrim",n:"vs Rival A"},{id:3,d:"2026-10-17",h:"16:00",t:"Torneo",n:"Torneo de ejemplo"},{id:4,d:"2026-10-20",h:"20:00",t:"Entrenamiento",n:"Revisión de VODs"},{id:5,d:"2026-10-22",h:"20:00",t:"Entrenamiento",n:""}],eid=10,A={},sel=1;
var TD=new Date(),cy=TD.getFullYear(),cm=TD.getMonth();
var CL={Entrenamiento:"#4cc9a0",Scrim:"#e0b84c",Torneo:"#ff4655",Premier:"#6fa8ff"};
var X=[["Ascendente 3",1.2,245],["Diamante 3",1.1,228],["Ascendente 1",1.0,210],["Diamante 1",1.05,215],["Platino 3",0.98,198]];
P.forEach(function(p,i){p.rk=X[i][0];p.kd=X[i][1];p.acs=X[i][2];p.tr=""});
var PC=["#ff4655","#e0b84c","#4cc9a0","#6fa8ff","#c58bff","#ff9a5c","#5cd6ff"];
function z(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function fmt(d){return new Date(d+"T00:00").toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"})}
function cmp(a,b){return (a.d+a.h)<(b.d+b.h)?-1:1}
function msg(ev){var a=A[ev.id]||{},s=function(v){return P.filter(function(p,i){return v==null?a[i]==null:a[i]===v}).map(function(p){return p.n}).join(", ")||"nadie"};
return "📅 "+ev.t+" · "+fmt(ev.d)+" "+ev.h+(ev.n?" · "+ev.n:"")+"\n✅ Entrenan: "+s(1)+"\n❌ No entrenan: "+s(0)+"\n⏳ Sin confirmar: "+s(null)}
function rNom(){var up=E.filter(function(e){return e.d>=iso(TD)}).sort(cmp);
if(!E.some(function(e){return e.id===sel}))sel=up.length?up[0].id:0;
var ev=E.find(function(e){return e.id===sel}),a=ev?(A[sel]=A[sel]||{}):{};
var yes=P.filter(function(p,i){return a[i]===1}).length;
var inp=function(i,f,v,ex){return '<input data-i="'+i+'" data-f="'+f+'" value="'+esc(v)+'" aria-label="'+f+'" '+(ex||"")+'>'};
$("#s-nomina").innerHTML='<h2>Nómina</h2><div class="card"><label>Sesión<select id="se">'+E.slice().sort(cmp).map(function(e){return '<option value="'+e.id+'"'+(e.id===sel?' selected':'')+'>'+esc(e.t+' · '+e.d+' '+e.h)+'</option>'}).join("")+'</select></label>'+
(ev?'<p><b>'+yes+'</b> de '+P.length+' confirmados</p><div class="scroll"><table><tr><th>Jugador</th><th>Rol</th><th>Asistencia</th></tr>'+P.map(function(p,i){return '<tr><td>'+esc(p.n)+'</td><td>'+esc(p.r)+'</td><td>'+[[1,"Entrena"],[0,"No entrena"],[null,"Pendiente"]].map(function(o){return '<button class="chipb" data-i="'+i+'" data-v="'+o[0]+'" aria-pressed="'+(a[i]==null?o[0]==null:a[i]===o[0])+'"'+(canAtt()?"":" disabled")+'>'+o[1]+'</button>'}).join("")+'</td></tr>'}).join("")+'</table></div><label style="margin-top:12px">Aviso para el grupo<textarea id="mg" rows="4" readonly>'+esc(msg(ev))+'</textarea></label><p><button class="btn" id="cp">Copiar aviso</button> <span id="cpm" class="sub"></span></p>':'<p class="sub">Aún no hay sesiones. Agenda la primera aquí abajo.</p>')+
'<h3 style="font-size:24px;margin:16px 0 6px">Agendar sesión</h3>'+QF()+'</div><h2 style="margin-top:22px">Asistencia a entrenamientos</h2>'+attHtml()+'<h2 style="margin-top:22px">Datos de jugadores</h2><div class="card scroll"><table><tr><th>Jugador</th><th>Rango</th><th>K/D</th><th>ACS</th><th>Tracker</th></tr>'+P.map(function(p,i){return '<tr><td>'+esc(p.n)+'</td><td>'+inp(i,"rk",p.rk)+'</td><td>'+inp(i,"kd",p.kd,'type="number" step="0.01" style="width:80px"')+'</td><td>'+inp(i,"acs",p.acs,'type="number" style="width:80px"')+'</td><td>'+(p.tr?'<a href="'+esc(p.tr)+'" target="_blank" rel="noopener" style="color:var(--gd)">Abrir tracker</a>':'')+inp(i,"tr",p.tr,'placeholder="Pega el link"')+'</td></tr>'}).join("")+'</table></div><h2 style="margin-top:22px">Agregar jugador</h2><div class="card"><form id="fp"><label>Nombre<input name="n" required></label><label>Rol<select name="r"><option>Duelista</option><option>Iniciador</option><option>Controlador</option><option>Centinela</option><option>Flex</option></select></label><label>Agentes (separados por coma)<input name="a"></label><label>Rango<input name="rk"></label><button class="btn">Agregar</button></form></div>'}
$("#s-nomina").onclick=function(e){var b=e.target.closest("button");if(!b)return;
if(b.dataset.v!=null){var a=A[sel]=A[sel]||{},i=+b.dataset.i;if(b.dataset.v==="null")delete a[i];else a[i]=+b.dataset.v;saveAtt(i);rNom();return}
if(b.id==="cp"){var t=$("#mg");t.select();try{navigator.clipboard.writeText(t.value);$("#cpm").textContent="Aviso copiado"}catch(x){$("#cpm").textContent="Copia el texto seleccionado"}}};
$("#s-nomina").onchange=function(e){var t=e.target;if(t.id==="se"){sel=+t.value;rNom()}else if(t.dataset.f){var v=t.value;P[t.dataset.i][t.dataset.f]=(t.dataset.f==="kd"||t.dataset.f==="acs")?+v:v;save();rNom()}};
$("#s-nomina").onsubmit=function(e){e.preventDefault();var f=new FormData(e.target);

const bad=e=>window.note("No se pudo leer la base de datos ("+(e.code||e.message)+")");
onSnapshot(doc(fs,"app","main"),s=>{let x=null;if(s.exists()){try{x=JSON.parse(s.data().j)}catch(e){}}window.mainState(!!x,x)},bad);
onSnapshot(collection(fs,"att"),q=>{const o={};q.forEach(d=>{const e=d.data().e||{};for(const k in e){(o[k]=o[k]||{})[+d.id]=e[k]}});window.attState(o)},bad);
</script>
