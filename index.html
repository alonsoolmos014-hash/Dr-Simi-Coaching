<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr Simi Coaching</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1826;--panel:#14243a;--line:#26395a;--tx:#e8e4d8;--mut:#8fa0b8;--ac:#ff4655;--gd:#e0b84c;--ok:#4cc9a0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef0f4;--panel:#fff;--line:#cdd5e2;--tx:#14243a;--mut:#5c6b82;--ac:#d92b3c;--gd:#9a7410;--ok:#127a5b}}
:root[data-theme="light"]{--bg:#eef0f4;--panel:#fff;--line:#cdd5e2;--tx:#14243a;--mut:#5c6b82;--ac:#d92b3c;--gd:#9a7410;--ok:#127a5b}
:root[data-theme="dark"]{--bg:#0d1826;--panel:#14243a;--line:#26395a;--tx:#e8e4d8;--mut:#8fa0b8;--ac:#ff4655;--gd:#e0b84c;--ok:#4cc9a0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;margin:0;letter-spacing:.01em}
header{padding:28px 20px 8px;max-width:1040px;margin:auto}
h1{font-size:clamp(40px,8vw,72px);line-height:.95;font-weight:700}
h1 span{color:var(--ac)}
.sub{color:var(--mut);margin:8px 0 0;max-width:60ch}
nav{display:flex;gap:4px;max-width:1040px;margin:18px auto 0;padding:0 20px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;color:var(--mut);font:600 20px 'Barlow Condensed',sans-serif;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:var(--tx);border-color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
main{max-width:1040px;margin:auto;padding:22px 20px 60px}
section[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.pl{border-top:4px solid var(--c)}
.av{width:56px;height:56px;border-radius:50%;background:var(--c);color:#0d1826;display:grid;place-items:center;font:700 24px 'Barlow Condensed',sans-serif;margin-bottom:10px}
.pl h3{font-size:24px}.pl small{color:var(--mut);display:block}
.tag{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:0 7px;margin:6px 4px 0 0;font-size:13px;color:var(--mut)}
.row{display:flex;gap:18px;flex-wrap:wrap}
.row>*{flex:1 1 300px}
.stat{font:700 44px/1 'Barlow Condensed',sans-serif}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.lo{background:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500}
.w{color:var(--ok);font-weight:500}.l{color:var(--ac);font-weight:500}
.scroll{overflow-x:auto}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
label{font-size:13px;color:var(--mut);display:grid;gap:3px}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:8px;font:inherit;width:100%}
.btn{background:var(--ac);color:#fff;border:0;border-radius:4px;padding:9px 16px;font:600 18px 'Barlow Condensed',sans-serif;cursor:pointer}
.btn.alt{background:none;border:1px solid var(--line);color:var(--tx)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tools button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;font:inherit}
.tools button[aria-pressed=true]{border-color:var(--gd);color:var(--gd)}
canvas{width:100%;max-width:760px;aspect-ratio:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;touch-action:none;display:block;cursor:crosshair}
.goal{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.goal input{width:auto;margin-top:5px}
.done span{text-decoration:line-through;color:var(--mut)}
h2{font-size:32px;margin-bottom:12px}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .5s}}
.chipb{background:var(--bg);color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:4px 10px;margin:2px 4px 2px 0;cursor:pointer;font:inherit;font-size:14px}
.chipb[aria-pressed=true]{border-color:var(--gd);color:var(--gd)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:560px}
.dh{color:var(--mut);font-size:13px;text-align:center}
.day{min-height:78px;text-align:left;vertical-align:top;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px;color:var(--tx);cursor:pointer;font:inherit;font-size:13px;overflow:hidden}
.chip{display:block;font-size:11px;border-radius:2px;padding:0 4px;margin-top:2px;color:#0d1826;background:var(--c);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
td input{min-width:90px}
#note{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 14px;border-radius:4px;z-index:9}
.ro #fm,.ro #fe,.ro #fp,.ro .goal-add,.ro [data-del],.ro .row form[data-p]{display:none}
.ro textarea,.ro [data-rf]{pointer-events:none}
.ro #fr,.ro [data-rdel]{display:none}
.ro td input{pointer-events:none;border-color:transparent}
.chipb[disabled]{opacity:.45;cursor:not-allowed}
#auth button{padding:5px 12px;font-size:16px}
.card{transition:border-color .2s}.card:hover{border-color:var(--mut)}
.h3{font-size:24px;margin-bottom:8px}
.li{padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}.li:last-child{border:0}.li small{color:var(--mut);display:block}
.res{display:inline-block;min-width:58px;text-align:center;border-radius:3px;padding:1px 8px;font:600 16px 'Barlow Condensed',sans-serif}
.res.w{background:var(--ok);color:#0d1826}.res.l{background:var(--ac);color:#fff}
.bd{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:0 7px;font-size:12px;color:var(--mut)}
.bd.l{border-color:var(--ac);color:var(--ac)}.pr-alta{border-color:var(--ac);color:var(--ac)}.pr-media{border-color:var(--gd);color:var(--gd)}
.gi{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.gi:last-child{border:0}
.gi small{display:block;color:var(--mut)}.gi.done .gt{text-decoration:line-through;color:var(--mut)}
.gi select{padding:4px}.gi .btn{padding:3px 10px;font-size:15px}
td .btn{padding:2px 10px;font-size:15px}
@media(prefers-reduced-motion:no-preference){section:not([hidden]){animation:fi .25s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
.ro #fg,.ro [data-gdel],.ro [data-mdel],.ro #imp{display:none}
.ro [data-gj]{pointer-events:none;opacity:.8}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:6px}
.ro #ft,.ro [data-ted],.ro [data-tdel],.ro #tkr,.ro #tka{display:none}
</style>
</head>
<body>
<header>
<h1>Dr Simi <span>Coaching</span></h1>
<p class="sub">Equipo UAH Valorant: roster, partidas, nómina, calendario y objetivos en un solo lugar. <a href="https://tracker.gg/valorant/premier/teams/35faf7b8-ac21-4e5a-8008-be784929958c" target="_blank" rel="noopener" style="color:var(--gd)">Equipo Premier en tracker.gg</a></p>
<div id="auth" style="margin-top:12px"></div>
<div id="tools" class="tools" style="margin-top:8px"><button id="exp">Exportar datos</button><button id="imp">Importar datos</button><input type="file" id="impf" accept="application/json,.json" hidden></div>
</header>
<nav role="tablist" id="tabs"></nav>
<div id="note" role="status" hidden></div>
<main>
<section id="s-panel"></section>
<section id="s-partidas" hidden></section>
<section id="s-rend" hidden></section>
<section id="s-riv" hidden></section>
<section id="s-tac" hidden></section>
<section id="s-nomina" hidden></section>
<section id="s-calendario" hidden></section>
<section id="s-objetivos" hidden></section>
</main>
<script>
var $=function(s){return document.querySelector(s)};
var P=[
{n:"Jugador 1",r:"Duelista",a:["Jett","Raze"],c:"#ff4655"},
{n:"Jugador 2",r:"Iniciador",a:["Sova","Fade"],c:"#e0b84c"},
{n:"Jugador 3",r:"Controlador",a:["Omen","Astra"],c:"#4cc9a0"},
{n:"Jugador 4",r:"Centinela",a:["Cypher","Killjoy"],c:"#6fa8ff"},
{n:"Jugador 5",r:"Flex / IGL",a:["Skye","Viper"],c:"#c58bff"}];
var M=[
{d:"2026-10-02",m:"Ascent",v:"Rival A",a:13,b:9,p:2,t:"Scrim"},
{d:"2026-10-04",m:"Haven",v:"Rival B",a:8,b:13,p:1,t:"Scrim"},
{d:"2026-10-06",m:"Ascent",v:"Rival C",a:13,b:11,p:1,t:"Oficial"},
{d:"2026-10-07",m:"Bind",v:"Rival A",a:13,b:5,p:2,t:"Scrim"},
{d:"2026-10-08",m:"Haven",v:"Rival D",a:11,b:13,p:0,t:"Oficial"}];
var G=[
{p:0,t:"Mejorar crosshair placement en rondas de ataque",x:1},
{p:0,t:"Entrar primero solo con utilidad de apoyo",x:0},
{p:1,t:"Reducir dardos desperdiciados en retakes",x:0},
{p:2,t:"Comunicar timings de humo en defensa",x:1},
{p:3,t:"Cambiar posición después de cada kill",x:0},
{p:4,t:"Llamar eco/force antes de la ronda 3",x:0}];
var tabs=[["panel","Panel"],["partidas","Partidas"],["rend","Rendimiento"],["riv","Rivales"],["tac","Tácticas"],["nomina","Nómina"],["calendario","Calendario"],["objetivos","Objetivos"]];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function show(id){tabs.forEach(function(t){$("#s-"+t[0]).hidden=t[0]!==id});
document.querySelectorAll("#tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.t===id)});
}
$("#tabs").innerHTML=tabs.map(function(t){return '<button role="tab" data-t="'+t[0]+'">'+t[1]+'</button>'}).join("");
$("#tabs").onclick=function(e){if(e.target.dataset.t)show(e.target.dataset.t)};

function stats(){var w=M.filter(function(x){return x.a>x.b}).length;
var pi=M.reduce(function(s,x){return s+x.p},0);
return{n:M.length,w:w,wr:M.length?Math.round(w/M.length*100):0,pw:M.length?Math.round(pi/(M.length*2)*100):0}}
function byMap(){var o={};M.forEach(function(x){o[x.m]=o[x.m]||{n:0,w:0};o[x.m].n++;if(x.a>x.b)o[x.m].w++});return o}

var HF={q:"",t:"",o:"new"},GF={p:"",st:"",pr:""};
function gst(g){return g.st||(g.x?"completado":"pendiente")}
function link(u){return /^https?:\/\//i.test(u||"")?'<a href="'+esc(u)+'" target="_blank" rel="noopener" style="color:var(--gd)">Ver VOD</a>':""}
function li(h){return '<div class="li">'+h+'</div>'}
function rPanel(){var s=stats(),td=iso(TD);
var recent=M.slice().sort(function(a,b){return a.d<b.d?1:-1}).slice(0,5);
var ups=E.filter(function(e){return e.d>=td}).sort(cmp);
var past=E.filter(function(e){return e.t==="Entrenamiento"&&e.d<td}),tm=0,cn=0;
past.forEach(function(e){P.forEach(function(p,i){cn++;if((A[e.id]||{})[i]===1)tm++})});
var att=cn?Math.round(tm/cn*100)+"%":"-",dn=G.filter(function(g){return gst(g)==="completado"}).length;
var al=[];
if(!E.some(function(e){return e.t==="Premier"&&e.d>=td}))al.push("No hay partido de Premier agendado.");
ups.slice(0,3).forEach(function(e){var a=A[e.id]||{},pe=P.filter(function(p,i){return a[i]==null}).length;if(pe)al.push(pe+" jugador"+(pe>1?"es":"")+" sin confirmar para "+e.t+" del "+fmt(e.d)+".")});
var nn=M.filter(function(x){return !(x.w||x.f||x.c)}).length;if(nn)al.push(nn+" partida"+(nn>1?"s":"")+" sin notas postpartido.");
var od=G.filter(function(g){return gst(g)!=="completado"&&g.fl&&g.fl<td}).length;if(od)al.push(od+" objetivo"+(od>1?"s":"")+" vencido"+(od>1?"s":"")+".");
if(past.length>=2)P.forEach(function(p,i){var y=past.filter(function(e){return (A[e.id]||{})[i]===1}).length;if(y/past.length<0.6)al.push(p.n+" tiene menos de 60% de asistencia.")});
var nk=P.filter(function(p){return +p.kd>0}),nc=P.filter(function(p){return +p.acs>0}),
ak=nk.length?(nk.reduce(function(t,p){return t+ +p.kd},0)/nk.length).toFixed(2):"-",ac=nc.length?Math.round(nc.reduce(function(t,p){return t+ +p.acs},0)/nc.length):"-";
var go=function(id,t){return ' <button class="btn alt" data-go="'+id+'">'+t+'</button>'};
$("#s-panel").innerHTML=nextPrem()+'<div class="row" style="margin-bottom:18px"><div class="card"><div class="stat">'+(s.n?s.w+" - "+(s.n-s.w):"-")+'</div>Balance de partidas'+(s.n?' ('+s.wr+'% winrate)':"")+'</div><div class="card"><div class="stat">'+att+'</div>Asistencia del equipo</div><div class="card"><div class="stat">'+(G.length?dn+"/"+G.length:"-")+'</div>Objetivos completados</div><div class="card"><div class="stat">'+(s.n?s.pw+"%":"-")+'</div>Pistols ganadas</div></div>'+
'<div class="row" style="margin-bottom:22px"><div class="card"><h3 class="h3">Últimos resultados</h3>'+(recent.length?recent.map(function(x){return li('<span class="res '+(x.a>x.b?"w":"l")+'">'+x.a+' - '+x.b+'</span> <b>'+esc(x.v)+'</b> <small>'+esc(x.m)+' · '+esc(x.d)+' · '+esc(x.t)+'</small>')}).join(""):'<p class="sub">Aún no hay partidas registradas.'+go("partidas","Registrar partida")+'</p>')+'</div><div class="card"><h3 class="h3">Próximos entrenamientos y scrims</h3>'+(ups.length?ups.slice(0,6).map(function(e){var a=A[e.id]||{},c=P.filter(function(p,i){return a[i]===1}).length;return li('<span class="bd" style="border-color:'+CL[e.t]+';color:'+CL[e.t]+'">'+esc(e.t)+'</span> <b>'+esc(e.n||e.t)+'</b> <small>'+fmt(e.d)+' · '+e.h+(e.mp?' · '+esc(e.mp):"")+' · '+c+'/'+P.length+' confirmados</small>')}).join(""):'<p class="sub">No hay sesiones próximas.'+go("calendario","Abrir calendario")+'</p>')+'</div><div class="card"><h3 class="h3">Alertas</h3>'+(al.length?al.map(function(t){return li('<span style="color:var(--gd)">▲</span> '+esc(t))}).join(""):'<p class="sub">Sin alertas por ahora.</p>')+'</div></div>'+
'<h2>Roster</h2><p class="sub" style="margin:-6px 0 12px">Promedio del equipo con los datos cargados: K/D '+ak+' · ACS '+ac+'. Los datos de cada jugador se ingresan a mano en Nómina.</p><div class="grid">'+
P.map(function(p){return '<div class="card pl" style="--c:'+p.c+'"><div class="av">'+esc(p.n.slice(-1))+'</div><h3>'+esc(p.n)+'</h3><small>'+esc(p.r)+'</small><small>'+esc(p.rk)+' · K/D '+p.kd+' · ACS '+p.acs+'</small><small>Win '+(p.wr||'-')+'% · HS '+(p.hs||'-')+'% · Pico '+esc(p.pk||'-')+'</small>'+(p.a||[]).map(function(a){return '<span class="tag">'+esc(a)+'</span>'}).join("")+(p.up?'<small>Actualizado '+esc(p.up)+'</small>':"")+(/^https?:\/\//i.test(p.tr||"")?'<a href="'+esc(p.tr)+'" target="_blank" rel="noopener" class="btn alt" style="display:inline-block;margin-top:8px;font-size:15px;padding:3px 10px;text-decoration:none;color:var(--tx)">Abrir Tracker</a>':"")+'</div>'}).join("")+'</div>'+prem()}
$("#s-panel").onclick=function(e){var b=e.target.closest("button");if(b&&b.dataset.go)show(b.dataset.go)};

function histHtml(){var q=HF.q.toLowerCase();
var rows=M.map(function(x,i){return[x,i]}).filter(function(z){var x=z[0];return (!HF.t||x.t===HF.t)&&(!q||String(x.v).toLowerCase().indexOf(q)>=0||String(x.m).toLowerCase().indexOf(q)>=0)});
rows.sort(function(a,b){return HF.o==="old"?(a[0].d>b[0].d?1:-1):HF.o==="dif"?((b[0].a-b[0].b)-(a[0].a-a[0].b)):(a[0].d<b[0].d?1:-1)});
if(!rows.length)return '<p class="sub" style="margin:0">'+(M.length?"Ninguna partida coincide con el filtro.":"Aún no hay partidas registradas. Registra la primera arriba.")+'</p>';
return '<table><tr><th>Fecha</th><th>Mapa</th><th>Rival</th><th>Marcador</th><th>Tipo</th><th>Detalles</th><th></th></tr>'+rows.map(function(z){var x=z[0],i=z[1],w=x.a>x.b,nf=function(l,k){return '<label style="margin-bottom:6px">'+l+'<textarea rows="2" data-mi="'+i+'" data-mf="'+k+'">'+esc(x[k]||"")+'</textarea></label>'};
return '<tr><td>'+esc(x.d)+'</td><td>'+esc(x.m)+'</td><td>'+esc(x.v)+'</td><td><span class="res '+(w?"w":"l")+'">'+x.a+' - '+x.b+'</span></td><td>'+esc(x.t)+'</td><td><details><summary style="cursor:pointer">Ver'+((x.w||x.f||x.c)?' ●':"")+'</summary><div style="min-width:240px;margin-top:6px"><p class="sub" style="margin:0 0 6px">'+[x.cm,x.bo,x.cp?"Comp: "+x.cp:""].filter(Boolean).map(function(v){return esc(v)}).join(" · ")+' '+link(x.vod)+'</p>'+nf("Salió bien","w")+nf("Falló","f")+nf("A corregir","c")+'</div></details></td><td><button class="btn alt" data-mdel="'+i+'" aria-label="Eliminar partida">✕</button></td></tr>'}).join("")+'</table>'}
function rPartidas(){var bm=byMap(),fld=function(l,n,x){return '<label>'+l+'<input name="'+n+'" '+(x||"")+'></label>'};
